<div class="form-container">

  <div class="form-card">

    <h2 class="form-title">
      <i class="fas fa-lightbulb"></i>
      Ajouter une suggestion
    </h2>

    <form [formGroup]="suggestionForm" (ngSubmit)="onSubmit()">

      <!-- Titre -->
      <div class="form-group">
        <label>Titre</label>
        <input type="text" formControlName="title" class="form-control">

        <small class="error"
          *ngIf="suggestionForm.get('title')?.invalid && suggestionForm.get('title')?.touched">
          Le titre doit commencer par une majuscule, contenir uniquement des lettres
          et avoir au moins 5 caractères.
        </small>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>Description</label>
        <textarea rows="4" formControlName="description" class="form-control"></textarea>

        <small class="error"
          *ngIf="suggestionForm.get('description')?.invalid && suggestionForm.get('description')?.touched">
          La description doit contenir au minimum 30 caractères.
        </small>
      </div>

      <!-- Catégorie -->
      <div class="form-group">
        <label>Catégorie</label>
        <select formControlName="category" class="form-control">
          <option value="">Choisir une catégorie</option>
          <option *ngFor="let cat of categories" [value]="cat">
            {{ cat }}
          </option>
        </select>

        <small class="error"
          *ngIf="suggestionForm.get('category')?.invalid && suggestionForm.get('category')?.touched">
          La catégorie est obligatoire.
        </small>
      </div>

      <!-- Date & Status -->
      <div class="form-row">
        <div class="form-group">
          <label>Date</label>
          <input type="text" formControlName="date" readonly class="form-control readonly">
        </div>

        <div class="form-group">
          <label>Status</label>
          <input type="text" formControlName="status" readonly class="form-control readonly">
        </div>
      </div>

      <!-- Bouton -->
      <div class="form-actions">
        <button type="submit"
                class="btn-submit"
                [disabled]="suggestionForm.invalid">
          <i class="fas fa-paper-plane"></i>
          Soumettre
        </button>
      </div>

    </form>

  </div>

</div>
